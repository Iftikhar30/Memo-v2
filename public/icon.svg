<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Full-bleed background gradient covering 100% of the canvas -->
    <linearGradient id="fullBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#028c54" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <!-- Golden Highlight Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Medicine Capsule Gradient -->
    <linearGradient id="capsuleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Soft Depth Filter -->
    <filter id="depthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 100% Full-bleed background with no margins or black border -->
  <rect width="512" height="512" fill="url(#fullBg)" />

  <!-- Center subtle radial glow -->
  <circle cx="256" cy="256" r="220" fill="rgba(255, 255, 255, 0.12)" />

  <!-- Main 3D Centered Logo Group -->
  <g filter="url(#depthGlow)" transform="translate(0, -10)">
    <!-- 1. Memo / Checklist Tablet -->
    <rect x="130" y="80" width="252" height="320" rx="36" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />

    <!-- Memo Clip (Top Header) -->
    <rect x="206" y="60" width="100" height="38" rx="14" fill="url(#goldGrad)" stroke="#ca8a04" stroke-width="2" />
    <circle cx="256" cy="79" r="8" fill="#ffffff" opacity="0.9" />

    <!-- Checklist Item Lines -->
    <rect x="175" y="145" width="130" height="14" rx="7" fill="#10b981" />
    <rect x="175" y="178" width="165" height="12" rx="6" fill="#94a3b8" opacity="0.7" />
    <rect x="175" y="206" width="140" height="12" rx="6" fill="#94a3b8" opacity="0.7" />
    <rect x="175" y="234" width="115" height="12" rx="6" fill="#94a3b8" opacity="0.7" />

    <!-- 2. Grocery Shopping Basket (Floating prominently) -->
    <g transform="translate(0, 30)">
      <!-- Basket Base -->
      <path d="M120 270 L148 385 Q154 400 172 400 L340 400 Q358 400 364 385 L392 270 Z" fill="#047857" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />
      <!-- Basket Weave -->
      <path d="M165 275 L180 395 M212 275 L222 395 M256 275 L256 395 M300 275 L290 395 M347 275 L332 395" stroke="#065f46" stroke-width="4" stroke-linecap="round" />
      <path d="M135 315 Q256 330 377 315 M142 355 Q256 370 370 355" stroke="#065f46" stroke-width="4" fill="none" />
      <!-- Basket Rim -->
      <rect x="108" y="258" width="296" height="24" rx="12" fill="#10b981" stroke="#ffffff" stroke-width="6" />
      <!-- Basket Handle -->
      <path d="M165 260 C165 160 347 160 347 260" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- 3. Medicine Capsule Badge -->
    <g transform="translate(362, 215) rotate(35)">
      <rect x="-26" y="-60" width="52" height="120" rx="26" fill="#ffffff" stroke="#0369a1" stroke-width="5" />
      <path d="M -26 0 H 26 V -34 A 26 26 0 0 0 -26 -34 Z" fill="url(#capsuleGrad)" />
      <line x1="-8" y1="20" x2="8" y2="20" stroke="#059669" stroke-width="4" stroke-linecap="round" />
      <line x1="0" y1="12" x2="0" y2="28" stroke="#059669" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- 4. Golden Checkmark Badge -->
    <g transform="translate(136, 136)">
      <circle cx="0" cy="0" r="34" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6" />
      <path d="M-15 -2 L-4 9 L18 -13" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
