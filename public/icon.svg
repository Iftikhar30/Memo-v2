<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cyan/Sky Gradient for Medicine -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Card/Sheet Gradient -->
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#10b981" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas (Matches Android & iOS launcher shape) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Subtle Outer Border/Gaze -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Inner Soft Radial Highlight -->
  <circle cx="256" cy="160" r="220" fill="rgba(52, 211, 153, 0.15)" />

  <!-- Main 3D Composition Group -->
  <g filter="url(#softShadow)">
    <!-- 1. Memo / Checklist Tablet -->
    <rect x="136" y="96" width="240" height="310" rx="36" fill="url(#sheetGrad)" stroke="#cbd5e1" stroke-width="3" />

    <!-- Memo Clip (Top Header) -->
    <rect x="206" y="76" width="100" height="36" rx="14" fill="url(#goldGrad)" stroke="#b45309" stroke-width="2" />
    <circle cx="256" cy="94" r="8" fill="#ffffff" opacity="0.9" />

    <!-- Memo Ruled Content Lines -->
    <rect x="180" y="152" width="130" height="12" rx="6" fill="#10b981" opacity="0.9" />
    <rect x="180" y="184" width="160" height="10" rx="5" fill="#94a3b8" opacity="0.6" />
    <rect x="180" y="210" width="140" height="10" rx="5" fill="#94a3b8" opacity="0.6" />
    <rect x="180" y="236" width="110" height="10" rx="5" fill="#94a3b8" opacity="0.6" />

    <!-- 2. Grocery Shopping Basket (Lower Half Floating Over Memo) -->
    <g transform="translate(0, 30)">
      <!-- Basket Base Outline -->
      <path d="M120 270 L150 380 Q156 396 174 396 L338 396 Q356 396 362 380 L392 270 Z" fill="#047857" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

      <!-- Basket Weave Accent lines -->
      <path d="M165 275 L182 390 M215 275 L225 390 M256 275 L256 390 M297 275 L287 390 M347 275 L330 390" stroke="#065f46" stroke-width="4" stroke-linecap="round" />
      <path d="M135 310 Q256 325 377 310 M144 350 Q256 365 368 350" stroke="#065f46" stroke-width="4" fill="none" />

      <!-- Basket Rim -->
      <rect x="110" y="258" width="292" height="22" rx="11" fill="#10b981" stroke="#ffffff" stroke-width="6" />

      <!-- Basket Handle -->
      <path d="M170 260 C170 170 342 170 342 260" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- 3. Medicine Capsule Badge (Right Wing) -->
    <g transform="translate(356, 210) rotate(35)" filter="url(#softShadow)">
      <!-- Pill Capsule Body -->
      <rect x="-24" y="-55" width="48" height="110" rx="24" fill="#ffffff" stroke="#0369a1" stroke-width="4" />
      <!-- Pill Top Half (Sky Blue) -->
      <path d="M -24 0 H 24 V -31 A 24 24 0 0 0 -24 -31 Z" fill="url(#skyGrad)" />
      <!-- Pill Bottom Half (Mint/White) with small cross -->
      <path d="M -5 18 H 5 M 0 13 V 23" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 4. Verified Golden Checkmark Stamp (Top Left) -->
    <g transform="translate(136, 136)" filter="url(#badgeGlow)">
      <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="6" />
      <path d="M-14 -2 L-4 8 L16 -12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Clean Bottom Brand Tag: MY MEMO -->
  <text x="256" y="472" text-anchor="middle" fill="#ecfdf5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="4">MY MEMO</text>
</svg>
